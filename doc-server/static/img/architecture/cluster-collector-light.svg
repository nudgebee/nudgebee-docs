<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 840" width="1560" height="840" role="img" aria-label="Architecture of the NudgeBee Cluster Collector. Inside the monitored Kubernetes cluster, an Event Watcher streams API-server events to a Runner, and a Node Agent DaemonSet exports eBPF spans to a bundled OTel Collector and ClickHouse while Prometheus scrapes it. The Runner queries Prometheus, your log store, the bundled trace store and an optional OpenCost exporter in place, discovers workloads from the Kubernetes API, launches short-lived Trivy, KRR and Popeye Jobs, and — when RBAC allows — remediates the cluster and silences alerts. A single outbound connection on port 443 reaches the NudgeBee Relay and Collector servers; no inbound port is opened.">
<defs>
<marker id="ah-push" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5b6875"/></marker>
<marker id="ah-pull" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8a94a0"/></marker>
<marker id="ah-act" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0f766e"/></marker>
<marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#c2900f"/></marker>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
